<div class="homeservice_header_2_elementor homeservice_header_2_elementor-14 homeservice_header_2_elementor-location-header" data-elementor-type="header">
    <section class="homeservice_header_2_elementor-section homeservice_header_2_elementor-top-section homeservice_header_2_elementor-element homeservice_header_2_elementor-element-dec2be6 homeservice_header_2_header homeservice_header_2_elementor-section-full_width homeservice_header_2_elementor-sticky homeservice_header_2_elementor-sticky--effects homeservice_header_2_elementor-invisible" data-settings='{"sticky":"top","animation":"fadeIn","sticky_on":["desktop","tablet","mobile"],"sticky_offset":0}'>
        <div class="homeservice_header_2_elementor-container homeservice_header_2_elementor-column-gap-no">
            <div class="homeservice_header_2_elementor-column homeservice_header_2_elementor-col-100">
                <div class="homeservice_header_2_elementor-widget-wrap homeservice_header_2_elementor-element-populated">
                    <section class="homeservice_header_2_elementor-section homeservice_header_2_elementor-inner-section homeservice_header_2_elementor-section-full_width homeservice_header_2_elementor-section-content-middle">
                        <div class="homeservice_header_2_elementor-container homeservice_header_2_elementor-column-gap-default homeservice_header_2_header-row">
                            
                            <!-- Logo Column - 20% width -->
                            <div class="homeservice_header_2_elementor-column homeservice_header_2_elementor-col-logo homeservice_header_2_elementor-inner-column">
                                <div class="homeservice_header_2_elementor-widget-wrap homeservice_header_2_elementor-element-populated">
                                    <div class="homeservice_header_2_elementor-widget homeservice_header_2_elementor-widget-theme-site-logo homeservice_header_2_elementor-widget-image">
                                        <div class="homeservice_header_2_elementor-widget-container">
                                            <a href="{{HOME_URL}}" class="homeservice_header_2_logo-link">
                                                {{LOGO_PLACEHOLDER}}
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Navigation Column - 60% width -->
                            <div class="homeservice_header_2_elementor-column homeservice_header_2_elementor-col-nav homeservice_header_2_elementor-inner-column">
                                <div class="homeservice_header_2_elementor-widget-wrap homeservice_header_2_elementor-element-populated">
                                    <div class="homeservice_header_2_elementor-widget homeservice_header_2_elementor-widget-n-menu homeservice_header_2_e-n-menu-layout-horizontal">
                                        <div class="homeservice_header_2_elementor-widget-container">
                                            <nav class="homeservice_header_2_e-n-menu" aria-label="Menu">
                                                <!-- Mobile Menu Toggle -->
                                                <button class="homeservice_header_2_e-n-menu-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Menu Toggle">
                                                    <span class="homeservice_header_2_e-n-menu-toggle-icon homeservice_header_2_e-open">
                                                        <i class="eicon-menu-bar"></i>
                                                    </span>
                                                    <span class="homeservice_header_2_e-n-menu-toggle-icon homeservice_header_2_e-close">
                                                        <i class="eicon-close"></i>
                                                    </span>
                                                </button>
                                                
                                                <!-- Desktop Menu - Dynamic Content Placeholder -->
                                                <div class="homeservice_header_2_e-n-menu-wrapper">
                                                    {{MENU_PLACEHOLDER}}
                                                </div>
                                            </nav>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Phone Button Column - 20% width -->
                            <div class="homeservice_header_2_elementor-column homeservice_header_2_elementor-col-phone homeservice_header_2_elementor-inner-column">
                                <div class="homeservice_header_2_elementor-widget-wrap homeservice_header_2_elementor-element-populated">
                                    <div class="homeservice_header_2_elementor-widget homeservice_header_2_elementor-widget-button">
                                        <div class="homeservice_header_2_elementor-widget-container">
                                            <div class="homeservice_header_2_elementor-button-wrapper homeservice_header_2_phone-cta">
                                                {{PHONE_PLACEHOLDER}}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </section>
</div>
