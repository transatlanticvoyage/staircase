<style>
/* zx_hd2 override: neutralize body padding injected by theme globals */
body, .admin-bar body, body.header-scrolled, .admin-bar body.header-scrolled {
    padding-top: 0 !important;
    margin-top: 0 !important;
}
</style>
<header class="zx_hd2_header" data-sticky="true">
    <div class="zx_hd2_container">
        <!-- Logo -->
        <div class="zx_hd2_logo">
            <a href="{{HOME_URL}}" class="zx_hd2_logo_link">
                {{LOGO_PLACEHOLDER}}
            </a>
        </div>
        
        <!-- Navigation -->
        <nav class="zx_hd2_nav" aria-label="Main Navigation">
            <button class="zx_hd2_mobile_toggle" aria-haspopup="true" aria-expanded="false" aria-label="Menu Toggle">
                <span class="zx_hd2_toggle_bar"></span>
                <span class="zx_hd2_toggle_bar"></span>
                <span class="zx_hd2_toggle_bar"></span>
            </button>
            <div class="zx_hd2_menu_wrapper">
                {{MENU_PLACEHOLDER}}
            </div>
        </nav>
        
        <!-- Phone CTA -->
        <div class="zx_hd2_cta">
            {{PHONE_PLACEHOLDER}}
        </div>
    </div>
</header>
