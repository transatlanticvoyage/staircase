<header class="hs2-header" data-sticky="true">
    <div class="hs2-container">
        <!-- Logo -->
        <div class="hs2-logo">
            <a href="{{HOME_URL}}" class="hs2-logo-link">
                {{LOGO_PLACEHOLDER}}
            </a>
        </div>
        
        <!-- Navigation -->
        <nav class="hs2-nav" aria-label="Main Navigation">
            <button class="hs2-mobile-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Menu Toggle">
                <span class="hs2-toggle-bar"></span>
                <span class="hs2-toggle-bar"></span>
                <span class="hs2-toggle-bar"></span>
            </button>
            <div class="hs2-menu-wrapper">
                {{MENU_PLACEHOLDER}}
            </div>
        </nav>
        
        <!-- Phone CTA -->
        <div class="hs2-cta">
            {{PHONE_PLACEHOLDER}}
        </div>
    </div>
</header>
